# pgBackRest-Konfiguration für die Stanza "frauenhaus".
# Repo auf getrenntem Volume/Server ablegen (3-2-1-Regel), Verschlüsselung aktiv.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
# Backup-Verschlüsselung – Passphrase NICHT einchecken, beim Deployment setzen:
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass=<beim Deployment setzen, z.B. via Secret-Mount>
compress-type=zst
start-fast=y
log-level-console=info

[frauenhaus]
pg1-path=/var/lib/postgresql/data
