# Entwicklungs- und produktionsnahe Umgebung: PostgreSQL 18 + Backend
# (Spring Boot mit Vaadin-UI).
# Start:  APP_ADMIN_PASSWORD=... docker compose up -d --build   ->  http://localhost:${WEB_PORT:-8080}
#
# VORAUSSETZUNG: Das Altsystem-Backup ../data.sql muss eine Verzeichnisebene
# ueber diesem Projekt liegen (es wird als initdb-Skript 03 eingebunden). Ohne
# die Datei startet der Stack nicht - fuer eine leere Datenbank ohne Altdaten
# stattdessen nur `docker compose up -d db` mit auskommentiertem 02-04-Mount
# oder direkt den Flyway-Weg nutzen (siehe README, "Start (Backend lokal)").
#
# Das Vaadin-UI wird direkt vom Backend ausgeliefert - ein separater
# Web-/nginx-Container entfaellt. Die DB ist vom Host aus nicht erreichbar;
# nur fuer die lokale Entwicklung mappt docker-compose.override.yml die DB
# (127.0.0.1:15432) auf den Host - in Produktion die Override-Datei weglassen:
# docker compose -f docker-compose.yml up -d
# TLS terminiert in Produktion ein vorgelagerter Reverse-Proxy (z.B. nginx/caddy).
#
# BACKUP: Es laeuft hier bewusst KEIN Backup-Dienst. Das pgBackRest-Konzept
# liegt als Entwurf unter ops/pgbackrest.conf und ist noch nicht verdrahtet
# (siehe README, "Offene Punkte").
#
# Die Init-Skripte (Schema + Datenuebernahme aus dem Altsystem-Backup ../data.sql)
# laufen nur beim allerersten Start auf leerem Volume. Neu aufsetzen mit:
#   docker compose down -v && docker compose up --build
services:

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: frauenhaus
      POSTGRES_USER: frauenhaus_app
      POSTGRES_PASSWORD: 'frauenhaus'
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Passwort der eingeschränkten App-Rolle (frauenhaus_backend, unterliegt Row Level Security)
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-frauenhaus}
    volumes:
      # Ab postgres:18 liegt das Datenverzeichnis unter /var/lib/postgresql/<major>/docker,
      # das Volume muss daher /var/lib/postgresql (statt .../data) mounten.
      - pgdata:/var/lib/postgresql
      # Alle Datenbank-Skripte liegen gemeinsam unter src/main/resources/db:
      #   migration/ = Flyway (versioniert),  init/ = nur initdb-Skripte dieses Stacks.
      # V1 ist eingefroren – Schemaänderungen kommen ausschließlich als neue Migration.
      - ./src/main/resources/db/migration/V1__baseline_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/main/resources/db/init/02_altdaten_vorbereitung.sql:/docker-entrypoint-initdb.d/02_altdaten_vorbereitung.sql:ro
      - ../data.sql:/docker-entrypoint-initdb.d/03_altdaten.sql:ro
      - ./src/main/resources/db/init/04_datenuebernahme.sql:/docker-entrypoint-initdb.d/04_datenuebernahme.sql:ro
      # Legt nur die Login-Rolle an; Rechte + Row Level Security kommen aus der
      # Flyway-Migration V7 (einzige Quelle der Wahrheit).
      - ./src/main/resources/db/init/05_sicherheit.sh:/docker-entrypoint-initdb.d/05_sicherheit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauenhaus_app -d frauenhaus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: frauenhaus
      # Eingeschränkte App-Rolle: kein DDL, kein BYPASSRLS – Zugriff auf personenbezogene
      # Daten nur mit gesetztem Benutzerkontext (Row Level Security, 05_sicherheit.sh)
      DB_USER: frauenhaus_backend
      DB_PASSWORD: ${DB_APP_PASSWORD:-frauenhaus}
      # Flyway-Migrationen brauchen DDL-/GRANT-Rechte und laufen daher als
      # Schema-Eigentümer; die App selbst bleibt die eingeschränkte RLS-Rolle.
      FLYWAY_DB_USER: frauenhaus_app
      FLYWAY_DB_PASSWORD: 'frauenhaus'
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      # SMTP für den Verteiler-Versand. Im Dev-Stack zeigt die Override-Datei
      # standardmäßig auf den Mailpit-Container (Demo-Inbox localhost:8025);
      # in Produktion hier den echten Mailserver konfigurieren – ohne ihn
      # funktioniert alles außer dem Verteiler-Versand.
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER:-no-reply@localhost}
    ports:
      # Backend liefert UI (Vaadin) und REST-API gemeinsam aus
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
