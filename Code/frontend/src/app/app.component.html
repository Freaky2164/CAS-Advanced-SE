@if (auth.user(); as user) {
  <header class="topbar">
    <span class="brand">Frauenhaus-Verwaltung</span>
    <nav>
      <a routerLink="/stammdaten" routerLinkActive="aktiv">Stammdaten</a>
      <a routerLink="/reports" routerLinkActive="aktiv">Reports</a>
      <a routerLink="/stichworte" routerLinkActive="aktiv">Stichworte</a>
      @if (user.roles.includes('ROLE_ADMIN')) {
        <a routerLink="/benutzer" routerLinkActive="aktiv">Benutzer</a>
      }
    </nav>
    <span class="spacer"></span>
    <span class="benutzer">{{ user.username }}</span>
    <button class="sekundaer" (click)="abmelden()">Abmelden</button>
  </header>
}

<main>
  <router-outlet />
</main>
