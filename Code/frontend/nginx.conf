# @author Nils
# nginx als Reverse Proxy mit TLS-Terminierung: einziger veröffentlichter
# Einstiegspunkt des Compose-Stacks.
# - Port 80 leitet dauerhaft auf HTTPS um
# - Port 443 servt den Angular-Build (SPA-Routing) und proxyt /api aufs Backend
# - Zertifikat: /etc/nginx/tls/tls.{crt,key} – in Produktion echtes Zertifikat
#   mounten, sonst erzeugt tls-selbstsigniert.sh beim Start ein Dev-Zertifikat
# - Actuator/Metriken werden bewusst NICHT durchgereicht

# HTTP -> HTTPS (bei abweichendem WEB_TLS_PORT https://host:<port> direkt aufrufen)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS erst mit echter Domain und echtem Zertifikat aktivieren – mit dem
    # selbstsignierten Dev-Zertifikat würde der Browser sich die Vorgabe für
    # sämtliche localhost-Anwendungen merken:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Upload-Limit der Dokument-Anhänge (Backend erlaubt 10 MB) + etwas Reserve
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api {
        # Docker-interner DNS-Resolver + Variable, damit nginx die Backend-IP
        # pro Anfrage auflöst und ein neu gebauter Backend-Container ohne
        # nginx-Neustart erreichbar bleibt.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: alle übrigen Pfade auf index.html, Angular-Router übernimmt
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Assets dürfen lange gecacht werden, index.html nicht
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
