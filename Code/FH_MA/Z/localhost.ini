# ===== DATENBANKVERBINDUNG =====
# Wichtig: Diese Einstellungen muessen fuer deinen PC angepasst werden!
database=SQLSERVER
dbhost=localhost
dbport=1433
# Fuer SQL Server Express: dbsid=frauenhaus;instance\=sqlexpress
# Fuer SQL Server Standard: dbsid=frauenhaus;instance\=MSSQLSERVER
dbsid=frauenhaus;instance\=MSSQLSERVER
dbuser=sa
# WICHTIG: Passwort wird bei Login abgefragt, NICHT hier speichern!
# Das ist ein Sicherheitsrisiko!
access=ODBC

# ===== BENUTZEROBERFLÄCHE =====
title=Frauenhaus Adress und Busgeldverwaltung
