# @author Nils
# Entwicklungs- und produktionsnahe Umgebung:
# PostgreSQL 18 + pgBackRest-Sidecar + Backend + Web (nginx mit Angular-Build).
# Start:  APP_ADMIN_PASSWORD=... docker compose up -d --build   ->  http://localhost:${WEB_PORT:-80}
#
# Einziger nach außen veröffentlichter Port ist der des Web-Containers; nginx
# reverse-proxyt /api intern auf backend:8080. Backend und DB sind vom Host aus
# nicht erreichbar. Nur für die lokale Entwicklung mappt docker-compose.override.yml
# Backend (127.0.0.1:8080) und DB (127.0.0.1:5432) auf den Host – in Produktion
# die Override-Datei weglassen: docker compose -f docker-compose.yml up -d
#
# Die Init-Skripte (Schema + Datenübernahme aus dem Altsystem-Backup ../data.sql)
# laufen nur beim allerersten Start auf leerem Volume. Neu aufsetzen mit:
#   docker compose down -v && docker compose up --build
services:

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: frauenhaus
      POSTGRES_USER: frauenhaus_app
      POSTGRES_PASSWORD: 'frauenhaus'
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Passwort der eingeschränkten App-Rolle (frauenhaus_backend, unterliegt Row Level Security)
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-frauenhaus}
    volumes:
      # Ab postgres:18 liegt das Datenverzeichnis unter /var/lib/postgresql/<major>/docker,
      # das Volume muss daher /var/lib/postgresql (statt .../data) mounten.
      - pgdata:/var/lib/postgresql
      - ./ops/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - backup:/var/lib/pgbackrest
      - ./V1__baseline_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/02_altdaten_vorbereitung.sql:/docker-entrypoint-initdb.d/02_altdaten_vorbereitung.sql:ro
      - ../data.sql:/docker-entrypoint-initdb.d/03_altdaten.sql:ro
      - ./db/init/04_datenuebernahme.sql:/docker-entrypoint-initdb.d/04_datenuebernahme.sql:ro
      - ./db/init/05_sicherheit.sh:/docker-entrypoint-initdb.d/05_sicherheit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauenhaus_app -d frauenhaus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: frauenhaus
      # Eingeschränkte App-Rolle: kein DDL, kein BYPASSRLS – Zugriff auf personenbezogene
      # Daten nur mit gesetztem Benutzerkontext (Row Level Security, 05_sicherheit.sh)
      DB_USER: frauenhaus_backend
      DB_PASSWORD: ${DB_APP_PASSWORD:-frauenhaus}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      # SMTP für den Verteiler-Versand (optional; ohne echten Mailserver
      # funktioniert alles außer /api/reports/verteiler/versenden)
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER:-no-reply@localhost}
    # Bewusst KEIN ports-Mapping: erreichbar nur im Compose-Netz (über den
    # Web-Proxy) bzw. lokal über docker-compose.override.yml.

  web:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Dev: hier landet das beim ersten Start erzeugte selbstsignierte Zertifikat
      # (bleibt so über Container-Neustarts stabil). Produktion: stattdessen das
      # echte Zertifikat read-only mounten, z.B.:
      #   - /etc/letsencrypt/live/<domain>/fullchain.pem:/etc/nginx/tls/tls.crt:ro
      #   - /etc/letsencrypt/live/<domain>/privkey.pem:/etc/nginx/tls/tls.key:ro
      - tls:/etc/nginx/tls

volumes:
  pgdata:
  backup:
  tls:
