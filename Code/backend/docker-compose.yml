# Entwicklungs- und Produktionsnahe Umgebung: PostgreSQL 16 + pgBackRest-Sidecar + Backend.
# Start:  DB_PASSWORD=... APP_ADMIN_PASSWORD=... docker compose up -d
#
# Die Init-Skripte (Schema + Datenübernahme aus dem Altsystem-Backup ../data.sql)
# laufen nur beim allerersten Start auf leerem Volume. Neu aufsetzen mit:
#   docker compose down -v && docker compose up --build
services:

  db:
    image: postgres:16
    environment: { POSTGRES_DB: frauenhaus, POSTGRES_USER: frauenhaus_app, POSTGRES_PASSWORD: 'frauenhaus', POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256" }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - backup:/var/lib/pgbackrest
      - ./V1__baseline_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/02_altdaten_vorbereitung.sql:/docker-entrypoint-initdb.d/02_altdaten_vorbereitung.sql:ro
      - ../data.sql:/docker-entrypoint-initdb.d/03_altdaten.sql:ro
      - ./db/init/04_datenuebernahme.sql:/docker-entrypoint-initdb.d/04_datenuebernahme.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauenhaus_app -d frauenhaus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: frauenhaus
      DB_USER: frauenhaus_app
      DB_PASSWORD: 'frauenhaus'
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  backup:
