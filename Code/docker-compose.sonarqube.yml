# Lokale SonarQube-Instanz für die statische Analyse des Backends.
# Bewusst ein EIGENER Compose-Stack (eigener Projektname), damit der Anwendungs-Stack
# aus docker-compose.yml davon unberührt bleibt:
#
#   docker compose -f docker-compose.sonarqube.yml -p sonarqube up -d
#   docker compose -f docker-compose.sonarqube.yml -p sonarqube down
#
# Analyse anstoßen: ops\sonar-analyse.ps1 (startet den Container, erzeugt einen
# Token und ruft "mvnw verify sonar:sonar" auf). UI: http://localhost:9000
#
# Hinweis: anonymer Zugriff/Scan ("sonar.forceAuthentication=false") wird von
# aktuellen SonarQube-Versionen nicht mehr unterstützt – die Analyse
# authentifiziert sich daher immer über einen Token (sonar.token), der zur
# Laufzeit erzeugt und NICHT im Repository abgelegt wird.
services:
  sonarqube:
    image: sonarqube:26.7.0.124771-community
    container_name: sonarqube
    ports:
      # nur lokal erreichbar, nicht im LAN
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: