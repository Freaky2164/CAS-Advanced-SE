# @author Nils
# ENTWURF - NOCH NICHT AKTIV.
# Diese Datei ist das dokumentierte Backup-Konzept, kein laufender Dienst:
# im docker-compose-Stack ist bewusst kein pgBackRest eingebunden (das Image
# postgres:18 bringt pgBackRest nicht mit). Siehe README, "Offene Punkte".
#
# Zur Inbetriebnahme fehlen noch:
#   1. Ein Sidecar-/Repo-Container mit installiertem pgBackRest, der dieselbe
#      pgdata-Volume und ein getrenntes Repo-Volume mountet.
#   2. Postgres-Einstellungen (postgresql.conf bzw. command-Parameter):
#        wal_level = replica
#        archive_mode = on
#        archive_command = 'pgbackrest --stanza=frauenhaus archive-push %p'
#   3. Einmalig: pgbackrest --stanza=frauenhaus stanza-create
#   4. Zeitplan fuer full/diff-Backups und dokumentierte Restore-Tests.
#
# pgBackRest-Konfiguration für die Stanza "frauenhaus".
# Repo auf getrenntem Volume/Server ablegen (3-2-1-Regel), Verschlüsselung aktiv.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
# Backup-Verschlüsselung – Passphrase NICHT einchecken, beim Deployment setzen:
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass=<beim Deployment setzen, z.B. via Secret-Mount>
compress-type=zst
start-fast=y
log-level-console=info

[frauenhaus]
# Datenverzeichnis des offiziellen postgres:18-Images (bis Postgres 16: /var/lib/postgresql/data)
pg1-path=/var/lib/postgresql/18/docker